# Gráfica de lenguajes del perfil, contando también los repos privados.
# Script propio (.github/scripts/lenguajes.py), sin código de terceros con el token.
# METRICS_TOKEN: token fine-grained de solo lectura (Contents y Metadata). Solo se publican porcentajes.
name: Lenguajes
on:
  schedule:
    - cron: "17 4 * * *"   # una vez al día
  workflow_dispatch:
permissions:
  contents: write          # para guardar lenguajes.svg en este repo
jobs:
  lenguajes:
    runs-on: ubuntu-latest
    if: github.repository == 'ddmr2811/ddmr2811'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Generar la gráfica
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 -I .github/scripts/lenguajes.py > lenguajes.svg.nuevo && mv lenguajes.svg.nuevo lenguajes.svg
      - name: Guardar si ha cambiado
        run: |
          if git diff --quiet -- lenguajes.svg; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lenguajes.svg
          git commit -m "Gráfica de lenguajes al día"
          git push
