# Gráficas del perfil (lenguajes y calendario), contando también los repos privados.
# Usa lowlighter/metrics (MIT), versión fija. Solo publica porcentajes y el calendario:
# ni nombres de repos ni código. Necesita el secreto METRICS_TOKEN (token de solo lectura).
name: Metrics
on:
  schedule:
    - cron: "17 4 * * *"   # una vez al día
  workflow_dispatch:
permissions:
  contents: write          # para guardar metrics.svg en este repo
jobs:
  metrics:
    runs-on: ubuntu-latest
    if: github.repository == 'ddmr2811/ddmr2811'
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          user: ddmr2811
          template: classic
          base: ""
          config_timezone: Europe/Madrid
          config_display: large
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: no
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
